[project]
name = "g2048"
version = "1.0.0"
description = "Deterministic 2048 engine and canonical expectimax AI (Python port of spec v1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
g2048 = "g2048.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.8,<0.20"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running in CPython (still runs by default; deselect with -m 'not slow')"]
