<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0e0d0c" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
		<meta name="description" content="2048 AI research & benchmarking platform — play, watch agents, replay any game deterministically, and compare TypeScript, Rust, Go and Python engines." />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<script>
			// Apply the theme before first paint to avoid a flash.
			(() => {
				const t = localStorage.getItem('theme');
				if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
