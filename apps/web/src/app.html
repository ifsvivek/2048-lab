<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="theme-color" content="#0f0e0d" media="(prefers-color-scheme: dark)" />
		<meta name="theme-color" content="#f8f7f4" media="(prefers-color-scheme: light)" />
		<meta name="description" content="2048 AI research & benchmarking platform — play, watch agents, replay any game deterministically, and compare TypeScript, Rust, Go, Python, C, C++, C#, Java and Lua engines." />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta property="og:title" content="2048 Lab: an AI experimentation and benchmarking platform" />
		<meta property="og:description" content="Play, watch AI agents, replay any game from a short code, and race nine language engines on identical games." />
		<meta property="og:type" content="website" />
		<meta property="og:image" content="%sveltekit.assets%/og.jpg" />
		<meta name="twitter:card" content="summary_large_image" />
		<script>
			// Apply the theme before first paint to avoid a flash.
			(() => {
				const t = localStorage.getItem('theme');
				if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
