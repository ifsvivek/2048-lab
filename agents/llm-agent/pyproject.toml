[project]
name = "g2048-llm-agent"
version = "1.0.0"
description = "LLM-backed 2048 agent (OpenRouter free models by default, or Claude): pull or push mode."
requires-python = ">=3.11"
dependencies = ["g2048"]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]

[tool.uv.sources]
g2048 = { path = "../../engines/python", editable = true }

[project.scripts]
g2048-llm = "agent:main"

[tool.uv]
package = false
